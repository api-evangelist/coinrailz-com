- aid: coinrailz-com:x402-services
  name: Coin Railz x402 Micropayment Services
  description: 'The 80 pay-per-request services as a standalone OpenAPI 3.0.3 contract (one POST /x402/<service>
    per service, price in the description): gas and token oracles, DEX liquidity, whale alerts, wallet risk, portfolio
    analytics, smart-contract audits, bridge quotes, agent wallets and KYA identity, Kalshi/Polymarket odds, NASA
    Earthdata and ESA imagery, fleet telematics and sensor data, GPT-4o-mini inference, property valuation, fraud
    and AML checks. Each endpoint returns an HTTP 402 x402 v2 challenge until paid.'
  image: https://coinrailz.com/apple-touch-icon.png
  humanURL: https://coinrailz.com/x402/catalog
  baseURL: https://coinrailz.com
  tags:
  - x402
  - Micropayments
  - DeFi
  - Prediction Markets
  - Satellite Data
  - IoT
  - AI Inference
  properties:
  - type: OpenAPI
    url: openapi/coinrailz-com-x402-services-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://coinrailz.com/openapi-x402-services.json
  - type: Overlay
    url: overlays/coinrailz-com-x402-services-overlay.yaml
  - type: Pricing
    url: https://coinrailz.com/.well-known/pricing.json
- aid: coinrailz-com:mcp
  name: Coin Railz MCP Server
  description: 'Remote MCP server on the primary domain: POST https://coinrailz.com/mcp (JSON-RPC 2.0). tools/list
    is open and returns 80 tools with input and output schemas; tool calls are metered (X-API-KEY prepaid credits
    or x402). A local stdio server ships as the PyPI package coinrailz-mcp. Every tool binds one-to-one to a /x402/<service>
    operation in the x402 services OpenAPI (see the tool crosswalk).'
  image: https://coinrailz.com/apple-touch-icon.png
  humanURL: https://coinrailz.com/mcp-integration-guide
  baseURL: https://coinrailz.com/mcp
  tags:
  - MCP
