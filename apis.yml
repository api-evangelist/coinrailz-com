apis:
- aid: coinrailz-com:agent-payment-api
  name: Coin Railz Agent Payment API
  description: 'The full Coin Railz surface: onboarding and prepaid-credit operations (free $5 trial key, Stripe
    hosted checkout), the 80 metered /x402/<service> endpoints, MPP (Machine Payments Protocol) twins of the core
    services, the ERC-4626 USDC yield vault on Base and the Kamino-backed Solana yield portal, plus the discovery
    manifests. OpenAPI 3.1.0, 106 operations, all with operationIds; auth is X-API-KEY / Bearer (cr_live_ prepaid
    credits), x402 X-PAYMENT or MPP Authorization: Payment.'
  image: https://coinrailz.com/apple-touch-icon.png
  humanURL: https://coinrailz.com/developers
  baseURL: https://coinrailz.com
  tags:
  - Payments
  - Agents
  - x402
