aid: coinrailz-com
name: Coin Railz
description: 'Coin Railz (Kellogg Holdings LLC) is pay-per-call financial and data infrastructure built for autonomous
  AI agents: 80 metered services - crypto and DeFi intelligence, trading signals, wallet and contract risk, prediction-market
  odds (Kalshi, Polymarket), NASA/ESA satellite data, IoT/DePIN feeds, AI inference, real estate and compliance
  checks - paid per request with x402 USDC micropayments on Base, Arc and Solana, or with card-funded prepaid credits.
  It publishes two OpenAPIs, a conformant A2A agent card, an open remote MCP server with 80 tools, an llms.txt,
  MPP and AP2 payment manifests, and an ERC-4626 USDC yield vault.'
url: https://raw.githubusercontent.com/api-evangelist/coinrailz-com/refs/heads/main/apis.yml
image: https://coinrailz.com/apple-touch-icon.png
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (was stub)
specificationVersion: '0.20'
created: '2026-09-19'
modified: '2026-09-19'
tags:
- Company
