apis:
- aid: coinrailz-com:mcp
  name: Coin Railz MCP Server
  description: >-
    Remote MCP server on the primary domain: POST https://coinrailz.com/mcp (JSON-RPC 2.0). tools/list
    is open and returns 80 tools with input and output schemas; tool calls are metered (X-API-KEY prepaid
    credits or x402). A local stdio server ships as the PyPI package coinrailz-mcp. Every tool binds one-to-one
    to a /x402/<service> operation in the x402 services OpenAPI (see the tool crosswalk).
  image: https://coinrailz.com/apple-touch-icon.png
  humanURL: https://coinrailz.com/mcp-integration-guide
  baseURL: https://coinrailz.com/mcp
  tags:
  - MCP
  - Agents
  - Tools
  properties:
  - type: MCPServer
