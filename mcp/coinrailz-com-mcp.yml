description: 'Coin Railz operates a remote MCP server on its primary domain: POST https://coinrailz.com/mcp with
  {jsonrpc:2.0, method:tools/list} returned 80 tools with inputSchema and outputSchema, anonymously (GET /mcp answers
  405 ''MCP transport only supports POST requests at /mcp''). Discovery documents at /.well-known/mcp.json, /.well-known/mcp-server.json
  and /.well-known/server-card.json name a non-standard tools_list/tools_call REST pair as well. Tool CALLS are
  paid: each tool description carries its USDC price and calls need an X-API-KEY (cr_live_ prepaid credits, free
  $5 trial at GET /api/m2m/credits/trial) or an x402 X-PAYMENT header. A local stdio server also ships as the PyPI
  package coinrailz-mcp (python -m coinrailz_mcp, 63 tools, COINRAILZ_API_KEY env) from github.com/tdnupe3/mcp-server-coinrailz.
  The full tools/list response is saved verbatim in coinrailz-com-mcp-tools-list.json.'
server:
  name: Coin Railz MCP Server
  transport: http
  url: https://coinrailz.com/mcp
  protocol: JSON-RPC 2.0 over HTTP POST
  auth: none for tools/list; X-API-KEY or x402 X-PAYMENT for tools/call
  discovery:
  - https://coinrailz.com/.well-known/mcp.json
  - https://coinrailz.com/.well-known/mcp-server.json
  - https://coinrailz.com/.well-known/server-card.json
  rest_shim:
    tools_list: https://coinrailz.com/mcp/tools/list
    tools_call: https://coinrailz.com/mcp/tools/call
    services: https://coinrailz.com/mcp/services
local:
