source: Derived by binding the 80 tools returned live by POST https://coinrailz.com/mcp tools/list to the operationIds
  in openapi/coinrailz-com-x402-services-openapi.yml (80 /x402/<service> operations) and openapi/coinrailz-com-agent-payment-api-openapi.yml
  (106 operations). Tool names are coinrailz_<service_id_with_underscores>; the binding is mechanical (underscore
  -> hyphen -> /x402/<id>) and every match was checked against the spec.
purpose: Bind each MCP tool to its backing REST operation so the tool inherits the operation's requestBody as its
  real input contract; record the operations the MCP surface does not expose (onboarding/credits, MPP, yield vault,
  Solana yield, manifests).
surfaces:
  rest_openapi: openapi/ (two specs; sources in openapi/_original/)
  mcp: https://coinrailz.com/mcp (tools/list open; tools/call metered)
