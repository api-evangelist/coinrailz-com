agent_hints:
  link_header: 'Link: <https://coinrailz.com/.well-known/agent-instructions.json>; rel="agent-instructions"'
  x_agent_instructions: true
  x_payment_recipe_url: https://coinrailz.com/x402/recipes/<service>
  x_trial_access: https://coinrailz.com/api/m2m/credits/trial
dry_run_mode:
  status: partial
  note: transaction-builder and the yield deposit-tx / redeem-tx operations return UNSIGNED calldata the agent signs
    and submits itself (non-custodial "builder pattern"), so on-chain actions can be inspected before execution;
    the metered data services have no dry-run flag.
reversibility:
  grade: documented
  write_surfaces:
  - surface: x402 per-call payments (80 /x402/* services)
    reversal: null
    window: null
    note: 'On-chain USDC settlement via the CDP facilitator; no refund, void or cancel operation is documented anywhere
      on the surface probed (grep of both specs and agent-instructions for refund/cancel/reverse: none).'
  - surface: Prepaid credits (createCheckoutSession / purchaseCredits)
    reversal: null
    window: null
    note: No refund policy published on a machine-readable surface; /terms-of-service is a client-rendered SPA route
      whose text could not be read by this pass.
  - surface: USDC yield vault deposit (getDepositTx / vlt-usdc-deposit)
    reversal: getRedeemTx / vlt-usdc-withdraw / vlt-usdc-zap-withdraw
    window: no lockup
    window_source: https://coinrailz.com/api/yield/manifest ("No lockup. Near-instant redemption"; fees.exit 0%)
    note: A reversal path exists and the manifest states there is no lockup, but no bounded window is stated, so
      this grades documented rather than verified.
  - surface: Solana yield deposit (buildSolanaDepositTx / confirmSolanaDeposit)
    reversal: redeem_hint in getSolanaYieldPosition
    window: null
    note: Position response includes a ready-to-sign withdraw tx; no window stated.
  - surface: Agent registration
    reversal: null
    window: null
  note: 'Grade is documented (0.4): reversal operations exist for the vault surfaces with a stated "no lockup",
    but no window is stated and the payment surfaces are irreversible by construction.'
