generated: '2026-09-19'
method: searched
source: openapi/ (both specs), https://coinrailz.com/api/auth/capabilities, /.well-known/agent-instructions.json,
  /.well-known/agent.json rateLimits + errors, /.well-known/agent-registration.json, /api/yield/manifest, and live
  response headers from POST /x402/ping (2026-09-19).
authentication:
  style: api-key-or-payment
  schemes:
  - name: apiKey
    header: X-API-KEY
    prefix: cr_live_
  - name: bearerApiKey
    header: 'Authorization: Bearer <cr_live_key>'
  - name: x402
    header: X-PAYMENT (also PAYMENT-SIGNATURE)
    note: base64url signed payment payload answering the 402 challenge
  - name: mpp
    header: 'Authorization: Payment <base64-credential>'
  public_operations:
  - getAuthCapabilities
  - getTrialKey
  - createCheckoutSession
  - getCheckoutStatus
  - getMppCatalog
  - getMppManifest
  - getX402Manifest
  - getAgentInstructions
  - getYieldManifest
  - getYieldRates
  - getYieldStats
  - getDepositTx
  - getRedeemTx
  - getYieldPosition
  - getYieldContract
  - getSolanaYieldManifest
  - getSolanaYieldRates
  - getSolanaYieldStats
  - buildSolanaDepositTx
  - confirmSolanaDeposit
  - getSolanaYieldPosition
  see: authentication/coinrailz-com-authentication.yml
idempotency:
  coverage: partial
  mechanism: request-body key, not a header
  scope:
  - buildSolanaDepositTx
  - purchaseCredits (POST /api/m2m/credits/purchase - documented in agent-instructions.json, not in the OpenAPI)
  - agent registration (POST /.well-known/agent-registration.json - keyed on walletAddress)
  details:
  - operation: buildSolanaDepositTx
    field: idempotency_key
    required: false
    window: 120s
    duplicate_response: 409 Duplicate idempotency_key - a pending intent already exists for this wallet/amount/key
    source: openapi/coinrailz-com-agent-payment-api-openapi.yml#buildSolanaDepositTx
  - operation: purchaseCredits
    field: idempotencyKey
    required: true
    note: '"Unique string per purchase (min 8 chars, UUID v4 recommended). Reuse safely on network retry."'
    source: https://coinrailz.com/.well-known/agent-instructions.json#quickStart.paths.cardPayment
  - operation: agent registration
    field: walletAddress
    note: 'agent-registration.json declares idempotencyKey: walletAddress'
  note: The 80 metered /x402/* services and the checkout-session flow document no replay protection; an x402 retry
    with a fresh signed payment is a second charge. 3 of ~90 write surfaces are covered - partial.
pagination:
  style: none
  note: Every service is a single-shot POST returning a bounded document; no cursor/offset parameters in either
    spec.
field_expansion: null
sparse_fields: null
metadata: null
